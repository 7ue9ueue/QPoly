name: NTT large convolution (exploration 010, convolution_mod_large)
on:
  push:
    branches: [claude/ntt-conv-large]
    paths: [work/ntt/conv_large/**, work/ntt/io_large/**, .github/workflows/ntt-conv-large.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    container:
      image: gcc:15.2.0@sha256:3ae15afe768b06d0c0fe088d822ba5f8045c26630bdacc8d8e7713cf5d8e7289
      options: --shm-size=4g
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: apt-get update -qq && apt-get install -y -qq util-linux > /dev/null
      - name: Correctness, calibration and timing (GCC 15.2, Library Checker flags)
        run: |
          set -a; . work/ntt/conv_large/ci.env; set +a
          mkdir -p results; echo "$GITHUB_SHA" > results/commit.txt
          if [ "$KERNEL" = 1 ]; then
            test "$(g++ -dumpfullversion)" = 15.2.0
            bash work/ntt/conv_large/run.sh results
          else echo "kernel job disabled by ci.env"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conv-large-${{ matrix.sample }}
          path: results/
          retention-days: 7
  io:
    runs-on: ubuntu-24.04
    container:
      image: gcc:15.2.0@sha256:3ae15afe768b06d0c0fe088d822ba5f8045c26630bdacc8d8e7713cf5d8e7289
      options: --shm-size=4g
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: apt-get update -qq && apt-get install -y -qq util-linux > /dev/null
      - name: I/O unit tests and timing (exploration 011, judge flags)
        run: |
          set -a; . work/ntt/conv_large/ci.env; set +a
          mkdir -p results-io; echo "$GITHUB_SHA" > results-io/commit.txt
          if [ "$IO" = 1 ]; then bash work/ntt/io_large/run_io.sh results-io; else echo "io job disabled by ci.env"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: io-large-${{ matrix.sample }}
          path: results-io/
          retention-days: 7
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Judge-like end-to-end (official cases, judge flags and container limits)
        run: |
          set -a; . work/ntt/conv_large/ci.env; set +a
          mkdir -p results-e2e; echo "$GITHUB_SHA" > results-e2e/commit.txt
          if [ "$E2E" = 1 ]; then bash work/ntt/conv_large/run_e2e.sh results-e2e
          else echo "e2e job disabled by ci.env"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conv-large-e2e-${{ matrix.sample }}
          path: results-e2e/
          retention-days: 7
  official:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: All 53 official cases, generated standalone file (hash-verified outputs)
        run: |
          set -a; . work/ntt/conv_large/ci.env; set +a
          mkdir -p results-official; echo "$GITHUB_SHA" > results-official/commit.txt
          if [ "$OFFICIAL" = 1 ]; then
            srcs=()
            IFS=';' read -ra BUILDS <<< "$OFFICIAL_BUILDS"
            for v in "${BUILDS[@]}"; do
              name=${v%%:*}; margs=${v#*:}; gen=work/ntt/conv_large/make_submission.py
              case "$margs" in "@io"*) gen=work/ntt/io_large/make_submission.py; margs=${margs#@io};; esac
              python3 $gen $margs --out "$RUNNER_TEMP/$name.cpp" | tee -a results-official/generated.txt
              cp "$RUNNER_TEMP/$name.cpp" results-official/; srcs+=("$RUNNER_TEMP/$name.cpp")
            done
            bash work/ntt/conv_large/run_official_all.sh results-official "${srcs[@]}"
          else echo "official job disabled by ci.env"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conv-large-official
          path: results-official/
          retention-days: 7
