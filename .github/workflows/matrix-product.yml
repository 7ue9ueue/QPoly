name: matrix_product exploration (exploration 013, Library Checker target)
on:
  push:
    branches: [claude/matrix-product]
    paths: [work/matrix_product/**, .github/workflows/matrix-product.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-24.04
    # Library Checker's compiler (gcc 15.2); same image digest as the earlier explorations
    container: gcc:15.2.0@sha256:3ae15afe768b06d0c0fe088d822ba5f8045c26630bdacc8d8e7713cf5d8e7289
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: apt-get update -qq && apt-get install -y -qq util-linux > /dev/null
      - name: Kernel correctness and timing (GCC 15.2, Library Checker flags)
        run: |
          test "$(g++ -dumpfullversion)" = 15.2.0
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash work/matrix_product/run.sh results
          { echo "### Job ${{ matrix.sample }}: $(grep '^cpu:' results/environment.txt)"; cat results/table.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.sample }}
          path: results/
          retention-days: 30
  e2e:
    # Judge-like end-to-end runs: host runner + docker (gcc 15.2 image, judge limits, tmpfs cases).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: End-to-end correctness and timing (exact judge compile command)
        run: |
          bash work/matrix_product/e2e/run_e2e.sh results-e2e
          { echo "### e2e job ${{ matrix.sample }}: $(grep -m1 'Model name' results-e2e/environment.txt)"; cat results-e2e/summary.txt; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.sample }}
          path: results-e2e/
          retention-days: 30
