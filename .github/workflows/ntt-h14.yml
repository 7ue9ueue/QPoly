name: NTT h14 target exploration
on:
  push:
    branches: [codex/ntt-simd-explore]
    paths: [work/ntt/h14_explore/**, work/ntt/atcoder_ntt_h14_compare.cpp, .github/workflows/ntt-h14.yml]
env:
  SELECT_VARIANTS: h14_fixed_tile,h14_pairmul_all,asm_radix4_pair_large_fixed,asm_inverse_serial,asm_inverse_pair,asm_inverse_pair_large,asm_both_pair,asm_both_pair_large,h14_forward_scalar,h14_forward_late,h14_forward_packed,h14_mont_mullo,h14_mont_shiftmod
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    container: gcc:15.2.0@sha256:3ae15afe768b06d0c0fe088d822ba5f8045c26630bdacc8d8e7713cf5d8e7289
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Environment and tools
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 binutils time
          mkdir -p results
          { lscpu; g++ --version; printf '%s\n' "$GITHUB_SHA"; cat /etc/os-release; } > results/environment.txt
          test "$(g++ -dumpfullversion)" = 15.2.0
          echo 'gcc:15.2.0@sha256:3ae15afe768b06d0c0fe088d822ba5f8045c26630bdacc8d8e7713cf5d8e7289' > results/container.txt
      - name: Correctness and timing
        run: python3 work/ntt/h14_explore/run.py
      - name: Assembly
        run: |
          for name in ll_inline_h14 asm_inverse_pair asm_both_pair_large h14_forward_scalar h14_mont_mullo h14_mont_shiftmod; do
            objdump -d -Mintel build/h14_explore/$name.o > results/$name-assembly.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h14-${{ matrix.sample }}
          path: results/
          retention-days: 7
  sanitize:
    runs-on: ubuntu-24.04
    container: gcc:15.2.0@sha256:3ae15afe768b06d0c0fe088d822ba5f8045c26630bdacc8d8e7713cf5d8e7289
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Environment and tools
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 time
          mkdir -p results
          { lscpu; g++ --version; printf '%s\n' "$GITHUB_SHA"; } > results/environment.txt
      - name: Sanitizers
        run: SANITIZE=1 python3 work/ntt/h14_explore/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h14-sanitize
          path: results/
          retention-days: 7
